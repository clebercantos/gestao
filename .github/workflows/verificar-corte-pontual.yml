name: Verificar corte pontual de video
on:
  pull_request:
    paths:
      - 'video-ai-pack/tools/corte-pontual.py'\n      - 'video-ai-pack/tools/edicao-aprovacao.py'\n      - 'video-ai-pack/tools/automatizar-video.ps1'
      - '.github/workflows/verificar-corte-pontual.yml'
  push:
    paths:
      - 'video-ai-pack/tools/corte-pontual.py'
      - '.github/workflows/verificar-corte-pontual.yml'
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe e localizacao por palavras (sem IA de rede)
        run: |
          python -m py_compile video-ai-pack/tools/corte-pontual.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("corte", "video-ai-pack/tools/corte-pontual.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          raw = ["Somos", "a", "décima", "sétima", "maior", "construtora", "do", "Brasil."]
          words = [{"raw": w, "token": mod.clean(w), "start": i * 0.3 + 1, "end": i * 0.3 + 1.2}
                   for i, w in enumerate(raw)]
          c = mod.candidates(words, "17 maior construtora do Brasil")
          assert len(c) == 1 and c[0]["numeral_identificado"], c
          PY
      - name: Instalar FFmpeg no runner (não vem pré-instalado)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Teste FFmpeg e sincronismo de audio/video
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30:duration=8 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=8 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/original.mp4
          python video-ai-pack/tools/corte-pontual.py /tmp/original.mp4 --inicio 2 --fim 3.5 --fade 0.16 --render --saida /tmp/corte.mp4
          python - <<'PY'
          import json, subprocess
          def probe(path):
              return json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,width,height","-of","json",path]))
          a,b = probe("/tmp/original.mp4"),probe("/tmp/corte.mp4")
          assert any(s.get("codec_type")=="audio" for s in b["streams"])
          assert any(s.get("width")==320 and s.get("height")==180 for s in b["streams"])
          assert abs(float(b["format"]["duration"])-6.34) < 0.25, b
          assert float(a["format"]["duration"]) >= 7.9
          PY
      - name: Validar fluxo proxy, aprovacao e 4K sem Whisper
        run: |
          python -m py_compile video-ai-pack/tools/edicao-aprovacao.py
          mkdir -p /tmp/edicao_teste
          python - <<'PY'
          import json, pathlib
          words=[]
          frase=["Somos","a","17ª","maior","construtora","do","Brasil."]
          import importlib.util
          spec=importlib.util.spec_from_file_location("corte","video-ai-pack/tools/corte-pontual.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for i,t in enumerate(frase):
              words.append({"raw":t,"token":mod.clean(t),"start":round(1.2+i*.32,3),"end":round(1.45+i*.32,3)})
          pathlib.Path("/tmp/edicao_teste/palavras.json").write_text(json.dumps(words),encoding="utf-8")
          PY
          python video-ai-pack/tools/edicao-aprovacao.py preparar /tmp/original.mp4 --trabalho /tmp/edicao_teste
          test -f /tmp/edicao_teste/proxy_720p.mp4
          ls /tmp/edicao_teste/AMOSTRA_DA_EMENDA_*.mp4
          if python video-ai-pack/tools/edicao-aprovacao.py finalizar /tmp/original.mp4 --trabalho /tmp/edicao_teste; then
            echo "ERRO: exportou sem aprovação"
            exit 1
          fi
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("/tmp/edicao_teste/revisao.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["inicio"] is not None and d["fim"] is not None,d
          d["aprovado"]=True
          d["aprovador"]="CI TESTE SINTETICO"
          p.write_text(json.dumps(d),encoding="utf-8")
          PY
          python video-ai-pack/tools/edicao-aprovacao.py finalizar /tmp/original.mp4 --trabalho /tmp/edicao_teste
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("/tmp/edicao_teste/QA_FINAL.json").read_text())
          assert d["passou"],d
          assert d["resolucao_original"]==d["resolucao_saida"],d
          assert pathlib.Path("/tmp/original.mp4").exists()
          PY
  validar_instalador_windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe PowerShell dos instaladores
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = "video-ai-pack/tools/instalar-artcraft-chatcut.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
          }
